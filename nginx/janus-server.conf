# /etc/nginx/sites-available/janus-server   (installed by `make nginx-install`)
# Janus front end + aPuppet web-admin. Plain HTTP, local network only.
#   Web UI:     http://<laptop-ip>:8080/
#   HTTP API:   http://<laptop-ip>:8080/janus
#   WebSocket:  ws://<laptop-ip>:8080/ws
#   Admin API:  http://localhost:8080/admin   (local only)
#
# web-admin served from :8080 shares an origin with the Janus API and needs no CORS. The app served
# from another port (`make app`, :8075) does, so /janus answers CORS itself (any origin: LAN only).
# Janus' own CORS headers are hidden so a browser never sees them duplicated.

map $http_upgrade $janus_conn_upgrade {
    default upgrade;
    ''      close;
}

upstream janus_server_http {
    server 127.0.0.1:8088;
    keepalive 16;
}

upstream janus_server_ws {
    server 127.0.0.1:8188;
}

upstream janus_server_admin {
    server 127.0.0.1:7088;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # aPuppet web-admin (static files)
    location / {
        root @WEB_ROOT@;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Janus HTTP API (REST + long-polling)
    location /janus {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, apisecret" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, apisecret" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass http://janus_server_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Janus WebSocket API
    location /ws {
        proxy_pass http://janus_server_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $janus_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Janus Admin / Monitor API: local access only
    location /admin {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://janus_server_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
